<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-gongwen-word-check — register-text scope boundary</title>
<desc id="desc">A vertical scope boundary. In scope on the left: the register's five canonical fields (docNo, signedAt, docKind, recipient, title) and the seven rules that read them; docNo carries GW-001 and GW-006, title carries GW-005 and GW-007, and GW-003 is the factory-empty document-kind list, so it reports itself in skipped. Out of scope on the right: typeface, type size, margins and seal placement, which a register cannot show. Below: the report, one issue at row 1 column docNo and one skipped rule; empty issues is not all clear.</desc>
