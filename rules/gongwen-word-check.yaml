# 公文格式要素核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"公文台账的版头与主体要素"是否齐备、发文字号格式是否成立。
#   其规范载体按**效力层级**分列如下（两份文件的全文均已逐字核对）：
#     · **GB/T 9704-2012《党政机关公文格式》** —— 标准号带"/T"，为**推荐性**国家标准；
#       **第 1 章**自述范围为「纸张要求、排版和印制装订要求、公文格式各要素的编排规则」，
#       并明确「**其他机关和单位的公文可以参照执行**」。
#       核到 **7.2.5**（发文字号：年份用**六角括号"〔〕"括入**，顺序号不加"第"字、不编虚位）、
#       **7.3.1**（标题用 2 号小标宋体字；**无字数上限**）、**7.3.2**（主送机关编排）、
#       **7.3.5.4**（成文日期用阿拉伯数字将年月日标全，**月、日不编虚位**）；
#       ⚠️ **前言**：「**本标准代替了 GB/T 9704—1999**」（历次版本 GB/T 9704—1988，**均已作废**），
#       且「本标准中公文用语与《党政机关公文处理工作条例》中的用语一致」。
#       见 rules/evidence/clause-verification-gbt9704.md。
#     · **《党政机关公文处理工作条例》（中办发〔2012〕14号）** —— 全文已核（见 clause-verification.md）：
#       **第八条**列举十五种文种（首句为「公文种类**主要**有」）、**第九条（七）**标题由发文机关名称、
#       事由和文种组成、**第九条（八）**主送机关是公文的主要受理机关。
#       ⚠️ 该条例**第四十二条**施行日期为 2012-07-01，**同时停止执行**1996 年与 2000 年两份旧文件。
#   ⚠️ **但本插件核对的是台账里登记的文字，不是公文正本的版式**：
#   标准第 5 章（页边与版心尺寸 156mm×225mm）、5.2.2（一般用 3 号仿宋体字）、
#   5.2.3（每面 22 行每行 28 字）、7.3.5.1（印章不得出现空白印章）等**版式要求，
#   本插件一概不核对** —— 台账里反映不出字体、字号、页边距与印章位置。
#   每条规则的 excerpt 仍写明"该条文本次未取得"（因**核对对象是台账而非公文正本**，
#   理由见 evidence 报告第五节），kind 保持 derived-from-principle（封顶 warn）
#   或 institutional-configuration（封顶 info）。
#   本插件的命中信息只应被读作"这一栏没填 / 文号形式不对 / 标题太长"，
#   而**不是**"公文格式不合规"。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件核对的是台账里登记的文字信息，
#   不核对公文的版式、字体、字号、页边距、印章位置等排版要素**——
#   那些必须以**公文正本的版式**为准，台账里反映不出来。
#   → 因此本插件只核对**台账自身的文字要素**：
#     发文字号形式、成文日期可解析、文种是否在册、主送机关是否填写、
#     标题是否过长、文号是否重复、是否残留模板占位符。
#   → 文种清单（docKinds）出厂为空，未配置即进 skipped。

plugin: dsh-gongwen-word-check
version: "2026.1"

rules:
  - id: GW-001
    title: 发文字号应符合机关代字〔年份〕序号的形式
    severity: warn
    basis:
      document: 《党政机关公文格式》
      number: GB/T 9704-2012（现行，本次未取得条文）
      clause: 7.2.5 发文字号
      excerpt: 该条文本次未取得：核查未获得 GB/T 9704-2012 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F3CC9BEF482524C895FDA7A08BB4A70E
    params:
      check:
        kind: pattern
        field: docNo
        pattern: ^[^〔〕（）()\s]+〔[0-9]{4}〕[0-9]+号$
        fix: 发文字号应按「机关代字〔年份〕序号」填写，年份用六角括号
    note: >-
      发文字号的规范形式是**机关代字〔年份〕序号**，年份用**六角括号〔〕**。
      依据说明（据 GB/T 9704-2012 **7.2.5** 逐字核对，见 rules/evidence/clause-verification-gbt9704.md）：
      原文「年份、发文顺序号**用阿拉伯数字标注**；年份应标**全称**，**用六角括号"〔〕"括入**；
      发文顺序号**不加"第"字，不编虚位**（即 1 不编为 01），在阿拉伯数字后**加"号"字**」。
      ⇒ **六角括号是标准的明文要求**，不是本插件自行收窄的写法。
      ⚠️ 本条**只核对形式**：机关代字本身由各机关规定，本插件不判断代字是否正确，
      也不判断序号是否连续或是否重号。
      若本机关的写法有特殊之处（例如联合发文、会议纪要无文号），
      请把 pattern 调整为符合本机关实际的写法，或停用本条。

  - id: GW-002
    title: 成文日期应可解析
    severity: warn
    basis:
      document: 《党政机关公文格式》
      number: GB/T 9704-2012（现行，本次未取得条文）
      clause: 7.3.5.4 成文日期中的数字
      excerpt: 该条文本次未取得：核查未获得 GB/T 9704-2012 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F3CC9BEF482524C895FDA7A08BB4A70E
    params:
      check:
        kind: date
        field: signedAt
        notAfter: today
    note: >-
      成文日期可解析是台账能被程序处理的前提；不应晚于核对日，
      是"这是已发出的公文"的**自洽条件**。本次未取得明文条号，故封顶 warn。
      本条识别 `2026-03-15` 与 `2026-03-15 09:30` 两种写法；
      **汉字日期（如「二〇二六年三月十五日」）会报"无法解析"**——
      台账若按公文习惯使用汉字日期，请先统一为可解析写法，或停用本条。
      本条**不核对成文日期与签发日期的关系**，那属于发文流程的内部一致性。

  - id: GW-003
    title: 文种应使用本机构口径的取值
    severity: info
    basis:
      document: 《党政机关公文处理工作条例》
      number: 中办发〔2012〕14号（自 2012 年 7 月 1 日起施行）
      clause: 第八条（公文种类主要有……共十五种）
      excerpt: 公文种类主要有：（一）决议。适用于会议讨论通过的重大决策事项。（二）决定。（三）命令（令）。（四）公报。（五）公告。（六）通告。（七）意见。（八）通知。（九）通报。（十）报告。（十一）请示。（十二）批复。（十三）议案。（十四）函。（十五）纪要。
      kind: institutional-configuration
      source: https://www.gov.cn/zwgk/2013-02/22/content_2337704.htm
    params:
      check:
        kind: enum
        field: docKind
        values: []
    note: >-
      ⚠️ **`kind` 仍为 `institutional-configuration`**（2026-10-07 判定，见
      rules/evidence/clause-verification-gongwen-articles.md）：**第八条列举的是十五种"主要"文种**，
      而本插件核对的是**所填文种是否落在本机关配置的清单内**（`values` 出厂为空即为未配置）——
      **"哪些文种可用"取决于本机关口径**，故依据类别仍是本机构配置。
      ⇒ `excerpt` 已换为**第八条的逐字引文**（十五种，此处按条内顺序节引其名称与首项的适用范围）。
      ✅ **不再有"未取得条文"的表述** —— 该条例全文已取得并逐字核对。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：《党政机关公文处理工作条例》列举了十五种主要文种，
      但**本插件不硬编码该清单**——一来未取得逐字条文，
      二来各单位在实际办文中还会使用未列入十五种的文书名称（如"方案""纪要""函件"等），
      哪些算合规文种应由本机关口径决定。
      建议把本机关允许的文种填入 values。本条**不判断某份公文应当使用哪一种文种**——
      那是拟稿与核稿人员的判断。

  - id: GW-004
    title: 公文台账应填写主送机关
    severity: warn
    basis:
      document: 《党政机关公文格式》
      number: GB/T 9704-2012（现行，本次未取得条文）
      clause: 7.3.2 主送机关
      excerpt: 该条文本次未取得：核查未获得 GB/T 9704-2012 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F3CC9BEF482524C895FDA7A08BB4A70E
    params:
      check:
        kind: presence
        field: recipient
        fix: 补填主送机关；本条只核对是否填写，不判断主送范围是否恰当
    note: >-
      主送机关是公文的**主要受理机关**，缺此栏就无法确认这份公文发给了谁，
      承办与归档都失去落点。本次未取得明文条号，故封顶 warn。
      本条只核对是否填写，**不判断主送范围是否恰当**——
      主送谁、抄送谁属于拟稿与核稿的判断。

  - id: GW-005
    title: 公文标题不应过长
    severity: warn
    basis:
      document: 《党政机关公文格式》
      number: GB/T 9704-2012（现行，本次未取得条文）
      clause: 7.3.1 标题
      excerpt: 该条文本次未取得：核查未获得 GB/T 9704-2012 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F3CC9BEF482524C895FDA7A08BB4A70E
    params:
      check:
        kind: length
        field: title
        maxLength: 60
        fix: 标题宜简洁；本条的上限来自本机构配置，不是标准数值
    note: >-
      公文标题一般由**发文机关名称、事由、文种**三要素构成，
      过长的标题在排版与阅读上都不便。本次未取得明文条号，故封顶 warn。
      **上限 60 字是本规则的出厂配置，不是标准数值**，而且这一点现在是**逐字确认**的：
      GB/T 9704-2012 **7.3.1** 对标题的量化要求只有「**2 号小标宋体字**」，
      其余是定性的「**词意完整，排列对称，长短适宜，间距恰当**」——
      **该标准未规定任何字数上限**。
      （"三要素"的出处是《党政机关公文处理工作条例》**第九条（七）**「标题。由发文机关名称、
      事由和文种组成」，见 rules/evidence/clause-verification.md。）
      本条只做字数核对，**不判断标题的文字表述是否规范**。

  - id: GW-006
    title: 发文字号不应在台账内重复
    severity: warn
    basis:
      document: 《党政机关公文处理工作条例》
      number: 中办发〔2012〕14号（自 2012 年 7 月 1 日起施行）
      clause: 第二十五条（二）登记（确定发文字号、分送范围和印制份数）
      excerpt: 发文办理主要程序是：……（二）登记。对复核后的公文，应当确定发文字号、分送范围和印制份数并详细记载。
      kind: derived-from-principle
      source: https://www.gov.cn/zwgk/2013-02/22/content_2337704.htm
    params:
      check:
        kind: unique
        field: docNo
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第二十五条（二）要求的是"对复核后的公文应当确定发文字号……并详细记载"**，
      **并未规定"发文字号在台账内不得重复"** —— 唯一性只是"一号一文"这一办文惯例的前提条件。
      ⇒ 保留 `derived-from-principle`（封顶 warn）；`excerpt` 已换为**逐字引文**。
      ✅ **不再有"未取得条文"的表述**。
      同一机关同一年度的发文字号不应重号，这是"一号一文"的**前提条件**。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      命中通常意味着重号或抄错，需人工确认——**不判断哪一份才应当使用该文号**。

  - id: GW-007
    title: 台账要素不应残留未替换的占位符
    severity: warn
    basis:
      document: 《党政机关公文格式》
      number: GB/T 9704-2012（现行，本次未取得条文）
      clause: 7.1 公文格式各要素的划分（版头、主体、版记）
      excerpt: 该条文本次未取得：核查未获得 GB/T 9704-2012 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=F3CC9BEF482524C895FDA7A08BB4A70E
    params:
      check:
        kind: containsAny
        field: title
        terms: ['【', '】', '{{', '}}', 'XXX', 'xxx', '待填', '待补充', 'TBD', 'todo']
        fix: 标题应填写实际内容；残留占位符说明台账是照模板抄的
    note: >-
      台账若直接照抄模板，标题栏常留下【】、XXX、待填、TBD 之类占位符。
      这会让人误以为已经核对了实际公文——**这是台账类工具最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。
      ⚠️ 出厂 terms **不含**「某」这个字：示例与模板常写"关于某某工作的通知"，
      但"某"也可能出现在正当标题中（如对外保密案件的代称），
      故不把它当占位符。若本机关模板确实以"某"占位，可自行加入。

disabled: []
